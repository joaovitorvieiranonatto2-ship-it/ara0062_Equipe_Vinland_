<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t">
  <title id="t">Deck de cartas colecionáveis</title>
  <rect width="400" height="300" fill="#f3e6ff"/>
  <circle cx="200" cy="150" r="120" fill="#e6d3f5"/>
  <ellipse cx="200" cy="246" rx="120" ry="8" fill="#241536" opacity="0.15"/>
  <!-- carta de trás -->
  <g transform="rotate(-18 200 230)">
    <rect x="145" y="70" width="110" height="160" rx="10" fill="#0f6e6e" stroke="#241536" stroke-width="3"/>
  </g>
  <!-- carta do meio -->
  <g transform="rotate(-3 200 230)">
    <rect x="145" y="70" width="110" height="160" rx="10" fill="#5b2a86" stroke="#241536" stroke-width="3"/>
    <rect x="157" y="82" width="86" height="136" rx="6" fill="none" stroke="#5ee6d0" stroke-width="2"/>
  </g>
  <!-- carta da frente -->
  <g transform="rotate(14 200 230)">
    <rect x="145" y="70" width="110" height="160" rx="10" fill="#ffb400" stroke="#241536" stroke-width="3"/>
    <rect x="157" y="82" width="86" height="136" rx="6" fill="none" stroke="#241536" stroke-width="2"/>
    <circle cx="200" cy="150" r="26" fill="#5b2a86"/>
    <text x="200" y="159" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffb400">V</text>
  </g>
</svg>
