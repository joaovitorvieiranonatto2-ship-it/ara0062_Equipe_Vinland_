<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t">
  <title id="t">Board game de estratégia, caixa para 2 a 4 jogadores</title>
  <rect width="400" height="300" fill="#f3e6ff"/>
  <circle cx="200" cy="150" r="120" fill="#e6d3f5"/>
  <ellipse cx="200" cy="284" rx="130" ry="8" fill="#241536" opacity="0.18"/>
  <!-- caixa em perspectiva -->
  <polygon points="90,130 310,130 310,250 90,250" fill="#0f6e6e"/>
  <polygon points="90,130 130,95 350,95 310,130" fill="#14837f"/>
  <polygon points="310,130 350,95 350,215 310,250" fill="#0a4f4f"/>
  <!-- rótulo da frente -->
  <rect x="110" y="150" width="180" height="80" rx="6" fill="#241536"/>
  <text x="200" y="186" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffb400">VÓRTEX</text>
  <text x="200" y="210" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#e6d9f2">ESTRATÉGIA · 2 A 4</text>
  <!-- peças em cima da mesa -->
  <circle cx="120" cy="276" r="10" fill="#ffb400"/>
  <circle cx="146" cy="276" r="10" fill="#5b2a86"/>
  <circle cx="172" cy="276" r="10" fill="#5ee6d0"/>
  <circle cx="198" cy="276" r="10" fill="#ff7a59"/>
</svg>
